<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parc Auto Mali — Catalogue</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f1f5f9; margin: 0; padding: 24px 16px; color: #1e293b;
  }
  .conteneur { max-width: 720px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #d97706; }
  h1 { margin: 4px 0 8px; font-size: 24px; color: #0f172a; }
  .sous-titre { color: #64748b; font-size: 14px; margin-bottom: 24px; }

  .grille-catalogue { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .carte-vehicule {
    background: white; border: 1px solid #e2e8f0; border-radius: 14px;
    overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .photo-vehicule {
    width: 100%; height: 140px; object-fit: cover; background: #e2e8f0;
    display: block;
  }
  .photo-vide {
    width: 100%; height: 140px; background: #e2e8f0; display: flex;
    align-items: center; justify-content: center; font-size: 34px;
  }
  .contenu-carte { padding: 14px 16px; }
  .marque { font-weight: 700; font-size: 16px; color: #0f172a; }
  .prix { font-weight: 700; font-size: 18px; color: #d97706; margin: 6px 0; }
  .details { font-size: 13px; color: #64748b; margin-bottom: 12px; }
  .btn-whatsapp {
    display: inline-flex; align-items: center; gap: 6px;
    background: #16a34a; color: white; text-decoration: none;
    border-radius: 8px; padding: 8px 14px; font-size: 13.5px; font-weight: 600;
  }
  .btn-whatsapp:hover { opacity: 0.9; }

  .vide { text-align: center; padding: 40px 20px; color: #94a3b8; font-size: 14px; background: white; border: 1px dashed #cbd5e1; border-radius: 12px; }
  .chargement { color: #94a3b8; font-size: 14px; text-align: center; padding: 30px; }
</style>
</head>
<body>
  <div class="conteneur">
    <p class="eyebrow">Parc Auto Mali</p>
    <h1>Nos véhicules disponibles</h1>
    <p class="sous-titre">Contactez-nous directement sur WhatsApp pour toute question ou visite.</p>

    <div id="zoneCatalogue" class="chargement">Chargement du catalogue…</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getFirestore, collection, onSnapshot,
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const NUMERO_WHATSAPP = "22300000000"; // ton vrai numéro (déjà corrigé chez toi)

    const firebaseConfig = {
      apiKey: "AIzaSyCHwyLj90IFVp25Xz6qWFrh8612vj4QQ0s",
      authDomain: "parc-auto-19b48.firebaseapp.com",
      projectId: "parc-auto-19b48",
      storageBucket: "parc-auto-19b48.firebasestorage.app",
      messagingSenderId: "1015165261940",
      appId: "1:1015165261940:web:37d0c01d46609e13871921",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const zoneCatalogue = document.getElementById("zoneCatalogue");

    onSnapshot(collection(db, "vehicules"), (snapshot) => {
      if (snapshot.empty) {
        zoneCatalogue.innerHTML = `<div class="vide">Aucun véhicule disponible pour le moment.</div>`;
        return;
      }

      zoneCatalogue.className = "grille-catalogue";
      zoneCatalogue.innerHTML = "";

      snapshot.forEach((docSnap) => {
        const v = docSnap.data();
        const message = encodeURIComponent(
          `Bonjour, je suis intéressé(e) par le véhicule : ${v.marque} (${v.annee}).`
        );
        const photo = v.photoUrl
          ? `<img class="photo-vehicule" src="${v.photoUrl}" alt="${v.marque}" />`
          : `<div class="photo-vide">🚗</div>`;

        const carte = document.createElement("div");
        carte.className = "carte-vehicule";
        carte.innerHTML = `
          ${photo}
          <div class="contenu-carte">
            <div class="marque">${v.marque}</div>
            <div class="prix">${Number(v.prix).toLocaleString("fr-FR")} FCFA</div>
            <div class="details">${v.annee} · ${Number(v.km).toLocaleString("fr-FR")} km</div>
            <a class="btn-whatsapp" target="_blank"
               href="https://wa.me/${NUMERO_WHATSAPP}?text=${message}">
              💬 Contacter sur WhatsApp
            </a>
          </div>
        `;
        zoneCatalogue.appendChild(carte);
      });
    }, (erreur) => {
      zoneCatalogue.innerHTML = `<div class="vide">Erreur de chargement : ${erreur.message}</div>`;
    });
  </script>
</body>
</html>
