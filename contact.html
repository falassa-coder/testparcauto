<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Parc Auto Mali</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f1f5f9; margin: 0; color: #1e293b; }

  /* ---- En-tête / navigation commune ---- */
  .entete-site { position: sticky; top: 0; z-index: 20; background: rgba(241,245,249,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #e2e8f0; }
  .entete-conteneur { max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 16px; }
  .marque-site { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #0f172a; text-decoration: none; }
  .logo-site { font-size: 18px; }
  .nav-site { display: flex; gap: 4px; background: white; border: 1px solid #e2e8f0; padding: 4px; border-radius: 10px; }
  .nav-lien { font-size: 13.5px; font-weight: 600; color: #64748b; text-decoration: none; padding: 7px 14px; border-radius: 8px; transition: background .15s, color .15s; }
  .nav-lien:hover { color: #0f172a; }
  .nav-lien.actif { background: #0f172a; color: white; }

  .page { padding: 24px 16px 40px; }
  .conteneur { max-width: 640px; margin: 0 auto; }
  .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #d97706; }
  h1 { margin: 4px 0 8px; font-size: 24px; color: #0f172a; }
  .sous-titre { color: #64748b; font-size: 14px; margin-bottom: 20px; }

  .carte { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .carte h2 { font-size: 15px; margin: 0 0 10px; color: #0f172a; }
  .carte p { font-size: 14.5px; line-height: 1.6; color: #334155; margin: 0; }

  .btn-whatsapp {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #16a34a; color: white; text-decoration: none;
    border-radius: 10px; padding: 13px 16px; font-size: 15px; font-weight: 600; margin-top: 12px;
  }
  .btn-whatsapp:hover { opacity: 0.9; }

  .ligne-coordonnee { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: #334155; padding: 8px 0; }
  .ligne-coordonnee + .ligne-coordonnee { border-top: 1px solid #f1f5f9; }
  .icone-coordonnee { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }

  .grille-lieux { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 560px) { .grille-lieux { grid-template-columns: 1fr 1fr; } }
  .carte-lieu h3 { font-size: 14.5px; margin: 0 0 8px; color: #0f172a; }
  .carte-lieu iframe { width: 100%; height: 180px; border: 0; border-radius: 10px; }
</style>
</head>
<body>
  <header class="entete-site">
    <div class="entete-conteneur">
      <a href="index.html" class="marque-site"><span class="logo-site">🚗</span> Parc Auto Mali</a>
      <nav class="nav-site">
        <a href="index.html" class="nav-lien">Catalogue</a>
        <a href="apropos.html" class="nav-lien">À propos</a>
        <a href="contact.html" class="nav-lien actif">Contact</a>
      </nav>
    </div>
  </header>

  <div class="page">
    <div class="conteneur">
      <p class="eyebrow">Parc Auto Mali</p>
      <h1>Nous contacter</h1>
      <p class="sous-titre">Une question sur un véhicule ou sur le paiement échelonné ? Écrivez-nous directement.</p>

      <div class="carte">
        <h2>Coordonnées</h2>
        <div class="ligne-coordonnee"><span class="icone-coordonnee">📞</span> +336 51 46 09 72</div>
        <div class="ligne-coordonnee"><span class="icone-coordonnee">🕐</span> Lundi – Samedi, 8h – 18h</div>
        <a class="btn-whatsapp" target="_blank" href="https://wa.me/33651460972?text=Bonjour%2C%20j%27aimerais%20avoir%20des%20informations%20sur%20un%20v%C3%A9hicule.">
          💬 Discuter sur WhatsApp
        </a>
      </div>

      <div class="carte">
        <h2>Nos localisations</h2>
        <div class="grille-lieux">
          <div class="carte-lieu">
            <h3>📍 Kayes</h3>
            <iframe src="https://www.google.com/maps?q=Kayes,+Mali&output=embed" loading="lazy"></iframe>
          </div>
          <div class="carte-lieu">
            <h3>📍 Bamako</h3>
            <iframe src="https://www.google.com/maps?q=Bamako,+Mali&output=embed" loading="lazy"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
